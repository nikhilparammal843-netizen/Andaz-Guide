<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andaz Dubai The Palm – Footstep Walkthrough</title>
<style>
:root{--bg:#0b252c;--card:#12343d;--ink:#f3efe8;--mut:#9db5b9;--acc:#f0b34a;--teal:#0f4a57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.app{display:flex;gap:20px;justify-content:center;align-items:flex-start;padding:16px;flex-wrap:wrap}
.stage{position:relative;width:min(100%,560px);aspect-ratio:597/789;overflow:hidden;border-radius:18px;background:#000;flex:none}
.cam{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;transition:transform .3s linear}
.cam.slow{transition:transform 1.1s ease}
.cam img{position:absolute;inset:0;width:100%;height:100%;display:block}
.cam svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:46px;height:46px;border:0;padding:0;cursor:pointer;border-radius:50%;background:#fff;color:var(--teal);display:grid;place-items:center;box-shadow:0 0 0 5px #ffffff66,0 3px 10px #0006;transform:translate(-50%,-50%) scale(var(--inv,1));transition:background .3s,color .3s}
.pin svg{position:static;width:24px;height:24px}
.pin.on{background:var(--acc);color:#0b252c;box-shadow:0 0 0 6px #f0b34a66,0 3px 10px #0006}
.pin.pulse::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #fff;animation:p 1.8s infinite}
@keyframes p{from{transform:scale(1);opacity:.9}to{transform:scale(1.8);opacity:0}}
.fp{opacity:0;animation:in .3s forwards}@keyframes in{to{opacity:1}}
.fp.old{opacity:.3;animation:none;transition:opacity 1.5s}
.you{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 7px #f0b34a66;transform:translate(-50%,-50%) scale(var(--inv,1));transition:left .13s linear,top .13s linear;pointer-events:none}
.tag{position:absolute;left:12px;bottom:12px;right:12px;background:#0b252ccc;backdrop-filter:blur(6px);padding:9px 12px;border-radius:12px;font-size:13px;z-index:4}
.rp{position:absolute;right:12px;top:12px;z-index:4;border:0;background:#fffc;color:#0b252c;border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer}
aside{width:min(100%,340px);background:var(--card);border-radius:18px;padding:20px}
.k{color:var(--acc);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
h2{margin:4px 0 2px;font:500 22px Georgia,serif}.eta{color:var(--mut);font-size:13px;margin-bottom:14px}
.bar{height:4px;background:#ffffff22;border-radius:4px;overflow:hidden;margin-bottom:10px}.bar b{display:block;height:100%;width:0;background:var(--acc)}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;padding:12px 0;border-top:1px solid #ffffff1a;font-size:14px;line-height:1.45;opacity:.3;transition:opacity .4s}
li.on{opacity:1}li em{flex:none;width:26px;height:26px;border-radius:50%;background:#ffffff22;display:grid;place-items:center;font-style:normal;font-size:12px}
li.on em{background:var(--acc);color:#0b252c;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chips button{border:1px solid #ffffff33;background:none;color:var(--ink);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer}
</style></head><body>
